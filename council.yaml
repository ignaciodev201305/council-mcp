# Configuración del consejo. Los modelos son IDs de OpenRouter (https://openrouter.ai/models).
# Stack por defecto: solo modelos baratos (Haiku, Luna, DeepSeek flash). Costo aproximado: 1 a 2 centavos
# de dólar por consulta, incluida la búsqueda web de producto.

# Prompt común a todos los miembros; se antepone al prompt de cada lente.
member_base_prompt: prompts/members/_base.md

# Mínimo de miembros que deben responder para sintetizar.
quorum: 3

supervisor:
  model: openai/gpt-6-luna
  temperature: 0.2
  prompt: prompts/supervisor.md
  # "tool" reintenta si el reporte no valida; con "native" un reporte inválido tumbaba la consulta con Luna.
  structured_output: tool

members:
  - name: tecnico
    model: anthropic/claude-haiku-5.5
    temperature: 0.3
    prompt: prompts/members/tecnico.md
    tools: [package_info]
    # Haiku a veces arma mal los argumentos del tool de salida (listas como texto); la salida nativa lo evita.
    structured_output: native

  - name: producto
    model: openai/gpt-6-luna
    temperature: 0.5
    prompt: prompts/members/producto.md
    tools: []
    # Busca competidores y alternativas actuales en la web (unos 0,007 USD más por llamada).
    web_search: true

  - name: riesgos
    model: deepseek/deepseek-v4.1-flash-1017
    temperature: 0.3
    prompt: prompts/members/riesgos.md
    # known_vulnerabilities consulta OSV; es gratis y no usa un LLM.
    tools: [package_info, known_vulnerabilities]

  - name: constructor
    model: anthropic/claude-haiku-5.5
    temperature: 0.6
    prompt: prompts/members/constructor.md
    tools: []
    structured_output: native
